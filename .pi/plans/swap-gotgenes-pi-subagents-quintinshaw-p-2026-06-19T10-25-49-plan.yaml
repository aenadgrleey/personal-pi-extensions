  - name: Update docs (README.md + AGENTS.md)
    steps:
      - 'README.md: drop the "disabled by default / /subagents toggle" line; describe the workflow extension instead'
      - "AGENTS.md: replace the @gotgenes/pi-subagents line with @quintinshaw/pi-dynamic-workflows line"
  - name: Delete subagents-toggle.ts
    steps:
      - rm pi-extensions/subagents-toggle.ts (untracked, no git rm needed)
  - name: Rewrite .pi/skills/subagent-orchestration/SKILL.md
    steps:
      - >-
        New content: frontmatter description mentioning 'save context (intermediate in script variables, not chat)' +
