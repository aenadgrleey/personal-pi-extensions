  - name: Update rtango config (drift protection)
    steps:
      - ".rtango/spec.yaml: add on_target_modified: skip override to the subagent-orchestration rule (only this rule)"
      - >-
        .rtango/lock.yaml: recompute content_hash for both deployments (plain + pi) — either `rtango sync` or sha256 of
        new files
  - name: Verify
    steps:
      - bun run check (or npm test) — tsc + biome + eslint via the check extension
      - >-
        Final grep: no orphan references to subagent/get_subagent_result/steer_subagent/@gotgenes/pi-subagents outside
        the swap commit itself
  - name: Commit the swap
    steps:
      - git add package.json README.md AGENTS.md .rtango/spec.yaml .rtango/lock.yaml (SKILL.md files are gitignored)
      - >-
        git commit: feat(extensions): swap @gotgenes/pi-subagents for @quintinshaw/pi-dynamic-workflows; drop
