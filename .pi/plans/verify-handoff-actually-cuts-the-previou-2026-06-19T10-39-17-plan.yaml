title: Verify handoff actually cuts the previous context
saved: "2026-06-19T10:39:17.646Z"
phases:
  - name: Diagnose what the LLM sees after handoff
    steps:
      - >-
        Read the plan file at the path from the handoff marker attributes (`plan="..."`) to confirm the YAML is on disk
        in `.pi/handoffs/` — just `ls` and a quick `cat` of the file.
      - >-
        In your first reply after the handoff, BEFORE doing anything else, report exactly what is in your context: (a)
        is the user-facing turn just the pickup prompt (the one inside `<plan-handoff ...>...</plan-handoff>`) and
        nothing else, or are the previous user / assistant / toolResult messages also still there? (b) is there any
        system-prompt mention of the prior plan?
      - >-
        If the previous user / assistant / toolResult messages are still visible, dump a short summary of the first 3–5
        of them so I can see what leaked through. If they are cut, say so explicitly with the wording "context is
        clean".
      - Then proceed to actually execute the plan from Phase 1 step 1 of the YAML you just read.
